<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><title>Vectors I: Homework 3 (Vector Product)</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d2433;--mute:#6b7280;--acc:#2f5bea;--line:#e6e3dc}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;background:var(--bg);color:var(--ink)}
a{color:inherit;text-decoration:none}
.wrap{max-width:860px;margin:0 auto;padding:48px 20px}
h1{font-size:28px;margin:0 0 4px}.sub{color:var(--mute);margin:0 0 36px}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:32px 0 12px}
.card{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:10px;transition:.15s}
.card:hover{border-color:var(--acc);box-shadow:0 4px 18px rgba(47,91,234,.08)}
.ic{width:40px;height:48px;border-radius:6px;background:#fdecea;color:#c0392b;font-weight:700;font-size:11px;display:grid;place-items:center;flex:none}
.t{font-weight:600}.m{color:var(--mute);font-size:13px}.go{margin-left:auto;color:var(--acc);font-weight:600;font-size:14px}
.bar{position:fixed;inset:0 0 auto 0;height:52px;display:flex;align-items:center;gap:12px;padding:0 14px;background:#1d2433;color:#fff;font-size:14px}
.bar .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar .m{color:#aab;white-space:nowrap}
.btn{border:1px solid #475066;border-radius:8px;padding:6px 12px;white-space:nowrap}.btn.p{background:var(--acc);border-color:var(--acc)}
.sp{flex:1}iframe{position:fixed;top:52px;left:0;width:100%;height:calc(100% - 52px);border:0}
.card.done{opacity:.45;filter:grayscale(1)}.card.done:hover{opacity:.8}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;background:#eef2ff;color:var(--acc);margin-left:8px;vertical-align:2px}
.badge.st{background:#f1efe9;color:var(--mute)}
.bubbles{display:flex;gap:8px;align-items:center;margin:-16px 0 8px;flex-wrap:wrap}
.bub{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 14px;font-size:14px;cursor:pointer;color:var(--ink)}
.bub.on{background:var(--ink);color:#fff;border-color:var(--ink)}.bub.trash{margin-left:auto;font-size:12px;padding:3px 10px;color:var(--mute)}
.more{position:relative;flex:none}.more>button{border:0;background:none;font-size:20px;line-height:1;padding:4px 8px;border-radius:8px;cursor:pointer;color:var(--mute)}
.more>button:hover{background:#f1efe9}
.menu{display:none;position:absolute;right:0;top:30px;z-index:5;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.1);min-width:170px;padding:4px}
.menu.open{display:block}.menu a,.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 12px;font:inherit;font-size:14px;border-radius:6px;cursor:pointer;color:var(--ink)}
.menu a:hover,.menu button:hover{background:#f6f5f1}.menu .del{color:#c0392b}.menu .dis{color:#aaa;cursor:default}
.note{color:var(--mute);font-size:12px;margin-top:40px}.empty{color:var(--mute);font-size:14px;margin:10px 0}
.nav{display:flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px;width:max-content;margin:0 0 28px}
.nav a{padding:6px 18px;border-radius:999px;font-weight:600;font-size:15px;color:var(--mute)}.nav a.on{background:var(--ink);color:#fff}
@media(max-width:600px){.bar .m{display:none}}
